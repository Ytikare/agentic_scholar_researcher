name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra ui
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest

  docker:
    name: Build and smoke-test the Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t scholar-agent:ci .
      - name: API starts and answers /health
        run: |
          docker run -d --name api -p 8000:8000 -e ANTHROPIC_API_KEY=dummy scholar-agent:ci
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
      - name: Web UI starts
        run: |
          docker run -d --name ui -p 8501:8501 -e PORT=8501 scholar-agent:ci scholar-ui
          for i in $(seq 1 30); do
            curl -sf localhost:8501/_stcore/health && exit 0
            sleep 1
          done
          docker logs ui
          exit 1

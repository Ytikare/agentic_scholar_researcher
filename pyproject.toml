[project]
name = "scholar-agent"
version = "0.1.0"
description = "Multi-agent research assistant that writes cited literature reviews from arXiv, built with LangGraph"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["langgraph", "llm-agents", "multi-agent", "claude", "arxiv", "literature-review"]
authors = [
    { name = "Ytikare", email = "ytikare2@tutanota.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.1",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Repository = "https://github.com/Ytikare/agentic_scholar_researcher"
Demo = "https://scholar-ui-dkc3.onrender.com/"

[project.scripts]
scholar = "scholar_agent.cli:main"
scholar-eval = "scholar_agent.evals.run:main"
scholar-consistency = "scholar_agent.evals.consistency:main"
scholar-judge-noise = "scholar_agent.evals.judge_noise:main"
scholar-api = "scholar_agent.api:main"
scholar-ui = "scholar_agent.ui:main"

[project.optional-dependencies]
ui = [
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real APIs (arXiv/Anthropic); run with `pytest -m live`"]
addopts = "-m 'not live'"
